[project]
name = "knowledge-ai-api"
version = "0.1.0"
description = "Knowledge-AI backend — FastAPI REST API and MCP server"
readme = "README.md"
authors = [
    { name = "Henry Merchan", email = "merchanha@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.31.0",
    "authlib>=1.7.2",
    "casbin>=1.43.0",
    "casbin-async-sqlalchemy-adapter>=1.17.0",
    "cryptography>=48.0.0",
    "fastapi>=0.128.0",
    "httpx>=0.28.0",
    "celery>=5.4",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.13.0",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.40.0",
    "mcp[cli]>=1.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_ai"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["knowledge_ai"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["authlib.*", "casbin.*", "casbin_async_sqlalchemy_adapter.*", "celery.*", "pgvector.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --cov=knowledge_ai --cov-report=term-missing"

[tool.coverage.run]
source = ["knowledge_ai"]
omit = ["tests/*"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
]
