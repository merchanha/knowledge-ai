[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, "admin") || (r.sub == p.sub && r.obj == p.obj && (r.act == p.act || (r.act == "WRITE" && p.act == "READ") || (r.act == "MANAGE" && (p.act == "READ" || p.act == "WRITE"))))
