services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: knowledge-ai-postgres
    environment:
      POSTGRES_USER: knowledge_ai
      POSTGRES_PASSWORD: knowledge_ai
      POSTGRES_DB: knowledge_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_ai -d knowledge_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: knowledge-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
